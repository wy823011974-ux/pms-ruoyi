server:
  port: 8080

spring:
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/pms_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: pms_user
    password: pms_dev_2026
  redis:
    host: localhost
    port: 6379
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  # 生产环境请使用环境变量 ${JWT_SECRET} 或外部配置中心
  secret: ${JWT_SECRET:pms-jwt-secret-key-2026-v2-change-in-production-to-64-char-random}
  expiration: 480

pms:
  upload-path: ./uploads
  max-file-size: 52428800

---
# 生产环境配置（spring.profiles.active=prod时生效）
# 数据库密码应通过环境变量注入：${DB_PASSWORD}
# 敏感信息不应硬编码在配置文件中
